[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "vip-api"
version = "0.1.0"
description = "Backend foundation for the Veltrix Intelligence Platform"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "arabic-reshaper>=3.0,<4",
  "aiomysql>=0.2,<1",
  "alembic>=1.16,<2",
  "argon2-cffi>=25.1,<26",
  "asyncpg>=0.30,<1",
  "cryptography>=50.0.0,<51",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pillow>=11.3,<13",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "python-bidi==0.6.11; python_version < '3.14'",
  "python-bidi==0.4.2; python_version >= '3.14'",
  "redis>=6.2,<7",
  "reportlab>=4.4,<5",
  "sqlalchemy>=2.0.41,<3",
  "tzdata>=2025.2,<2027",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "httpx2>=2.7,<3",
  "mypy>=1.17,<2",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vip_api"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "unit: tests that do not require external services",
  "integration: tests that require PostgreSQL and/or Redis",
  "security: authorization and security-boundary tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["INP001"]
"tests/**/*.py" = ["S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["vip_api"]

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
show_error_codes = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true
