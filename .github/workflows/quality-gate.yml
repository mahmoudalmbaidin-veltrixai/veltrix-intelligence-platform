name: Platform quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build
      - run: npm audit --audit-level=low

  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: vip_test
          POSTGRES_USER: vip
          POSTGRES_PASSWORD: vip_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vip -d vip_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.0-alpine@sha256:5f61955be8ab2ccee9372b84ae4d4da2e2b156f87281e3f218544055e7ee04d4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      VITE_API_MODE: live
      VITE_APP_ENV: development
      VITE_ENABLE_MOCK_LATENCY: 'false'
      VITE_API_BASE_URL: http://localhost:8000/api/v1
      DATABASE_URL: postgresql+asyncpg://vip:vip_test@localhost:5432/vip_test
      REDIS_URL: redis://localhost:6379/14
      APP_ENV: test
      CORS_ALLOWED_ORIGINS: http://localhost:3009
      CORS_ALLOW_CREDENTIALS: 'true'
      CSRF_TRUSTED_ORIGINS: http://localhost:3009
      FRONTEND_URL: http://localhost:3009
      AUTH_MAX_ACTIVE_SESSIONS_PER_USER: '100'
      AUTH_LOGIN_RATE_LIMIT_PER_MINUTE: '1000'
      VIP_E2E_EMAIL: tenant-a@vip.demo
      CONNECTION_ENCRYPTION_KEY: REREREREREREREREREREREREREREREREREREREREREQ=
      CONNECTION_ENCRYPTION_KEY_VERSION: ci-v1
      CONNECTION_ALLOW_PRIVATE_NETWORKS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements.lock
      - run: npm ci
      - run: python -m pip install -r requirements.lock
        working-directory: apps/api
      - run: python -m pip install --no-deps -e .
        working-directory: apps/api
      - run: alembic upgrade head
        working-directory: apps/api
      - name: Generate ephemeral browser-test password
        run: |
          password="$(openssl rand -base64 36 | tr -d '\n')"
          echo "::add-mask::$password"
          echo "VIP_E2E_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Seed browser-test tenants
        run: |
          VIP_DEMO_USER_A_PASSWORD="$VIP_E2E_PASSWORD" \
          VIP_DEMO_USER_B_PASSWORD="$VIP_E2E_PASSWORD" \
          VIP_DEMO_USER_C_PASSWORD="$VIP_E2E_PASSWORD" \
          python -m vip_api.cli seed-multitenancy-demo
        working-directory: apps/api
      - name: Grant platform super-admin to the browser-test owner
        run: python -m vip_api.cli grant-platform-admin --email tenant-a@vip.demo
        working-directory: apps/api
      - name: Configure governance personas
        run: |
          VIP_GOVERNANCE_ADMIN_PASSWORD="$VIP_E2E_PASSWORD" \
          VIP_GOVERNANCE_EDITOR_PASSWORD="$VIP_E2E_PASSWORD" \
          VIP_GOVERNANCE_VIEWER_PASSWORD="$VIP_E2E_PASSWORD" \
          VIP_GOVERNANCE_RESTRICTED_PASSWORD="$VIP_E2E_PASSWORD" \
          python -m vip_api.cli configure-governance-demo
        working-directory: apps/api
      - run: python -m vip_api.cli seed-connection-types
        working-directory: apps/api
      - name: Seed B5 dataset and semantic demo
        run: |
          B5_DEMO_POSTGRES_PASSWORD="vip_test" python -m vip_api.cli seed-dataset-catalogs
          python -m vip_api.cli seed-semantic-layer
        working-directory: apps/api
      - name: Start API
        run: uvicorn vip_api.main:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
        working-directory: apps/api
      - name: Wait for API readiness
        run: |
          for _ in {1..30}; do
            curl --fail --silent http://localhost:8000/ready && exit 0
            sleep 1
          done
          cat apps/api/api.log
          exit 1
      - run: npx playwright install --with-deps chromium firefox msedge
      - run: npm run test:e2e
      - run: npm run test:a11y
      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  backend-static-and-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements.lock
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install pip-audit
      - run: pip-audit -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src tests
      - run: pytest -m "not integration"

  backend-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: vip_test
          POSTGRES_USER: vip
          POSTGRES_PASSWORD: vip_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vip -d vip_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.0-alpine@sha256:5f61955be8ab2ccee9372b84ae4d4da2e2b156f87281e3f218544055e7ee04d4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: test
      ENABLE_DOCS: 'false'
      DATABASE_URL: postgresql+asyncpg://vip:vip_test@localhost:5432/vip_test
      REDIS_URL: redis://localhost:6379/15
      RUN_INTEGRATION_TESTS: '1'
      CONNECTION_ENCRYPTION_KEY: REREREREREREREREREREREREREREREREREREREREREQ=
      CONNECTION_ENCRYPTION_KEY_VERSION: ci-v1
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements.lock
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python scripts/backend_quality.py
      - run: alembic check

  backend-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build api dashboard-worker pipeline-worker
      - name: Scan backend image for release-blocking vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: vip-api:latest
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: false
