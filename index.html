<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0b1220" />
    <meta
      name="description"
      content="Veltrix One — enterprise analytics, data pipelines and dashboards in one platform."
    />
    <meta property="og:title" content="Veltrix One" />
    <meta property="og:description" content="Enterprise analytics, data pipelines and dashboards in one platform." />
    <meta property="og:image" content="/favicon.svg" />
    <meta property="og:type" content="website" />
    <title>Veltrix One</title>
    <style>
      /* Zero-JS branded boot splash — replaced when the Vue app mounts. */
      #vip-boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #0b1220;
        color: #eef2ff;
      }
      #vip-boot .vip-boot__word {
        font-family:
          'Inter',
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        font-weight: 700;
        letter-spacing: 0.01em;
        font-size: 22px;
      }
      #vip-boot .vip-boot__spin {
        width: 22px;
        height: 22px;
        border: 2px solid rgba(238, 242, 255, 0.25);
        border-top-color: #3a97ff;
        border-radius: 50%;
        animation: vip-boot-spin 0.7s linear infinite;
      }
      @keyframes vip-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #vip-boot .vip-boot__spin {
          animation-duration: 0.001ms;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="vip-boot">
        <svg width="60" height="60" viewBox="0 0 48 48" aria-hidden="true">
          <rect x="3" y="3" width="42" height="42" rx="11" fill="#1E73E6" />
          <path
            d="M14 15.5 L24 32.5 L34 15.5"
            fill="none"
            stroke="#ffffff"
            stroke-width="4.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <circle cx="24" cy="12.5" r="2.6" fill="#ffffff" />
        </svg>
        <span class="vip-boot__word">Veltrix One</span>
        <span class="vip-boot__spin"></span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
